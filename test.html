<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Classroom UI</title>

  <!-- GOOGLE ICONS -->
  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <style>

    /* ================= ROOT COLORS ================= */

    :root{
      --main-bg:#b8d4b2;
      --top-bottom:#d8c1a1;
      --panel:#f5f5f5;
      --cyan:#c8e7ea;
      --gray:#cfcfcf;
      --text:#222;
      --white:#efefef;
    }

    /* ================= DARK MODE ================= */

    body.dark-mode{
      --main-bg:#1f2a24;
      --top-bottom:#3c352d;
      --panel:#2c2c2c;
      --cyan:#35545a;
      --gray:#4c4c4c;
      --text:#ffffff;
      --white:#3a3a3a;
    }

    /* ================= GLOBAL ================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    html,
    body{
      width:100%;
      min-height:100%;
    }

    body{
      background:#ffffff;
      overflow-x:hidden;
    }

    /* ================= MAIN CONTAINER ================= */

    .container{
      width:100%;
      min-height:100vh;
      background:var(--main-bg);
      position:relative;
      overflow:hidden;
      transition:0.3s;
    }

    /* ================= TOP BAR ================= */

    .top-bar{
      width:100%;
      height:75px;
      background:var(--top-bottom);
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 25px;
      transition:0.3s;
    }

    .classroom-name{
      width:280px;
      height:42px;
      background:var(--white);
      border-radius:10px;
      display:flex;
      align-items:center;
      padding-left:18px;
      font-size:18px;
      color:var(--text);
      transition:0.3s;
    }

    .settings-btn{
      width:45px;
      height:45px;
      background:var(--white);
      border-radius:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .settings-btn span{
      font-size:32px;
      color:var(--text);
    }

    /* ================= SETTINGS PANEL ================= */

    .settings-panel{
      width:120px;
      height:475px;
      background:var(--gray);
      border-radius:22px;
      position:fixed;
      top:12px;
      right:-150px;
      transition:0.4s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:24px;
      gap:22px;
      z-index:999;
    }

    .settings-panel.active{
      right:20px;
    }

    .setting-option{
      width:72px;
      height:86px;
      background:var(--cyan);
      border-radius:18px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .setting-option:hover{
      transform:scale(1.05);
    }

    .setting-option span{
      font-size:42px;
      color:var(--text);
    }

    /* ================= MAIN CONTENT ================= */

    .main-content{
      width:100%;
      min-height:calc(100vh - 130px);
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:50px;
      padding:35px;
      flex-wrap:wrap;
    }

    /* ================= LEFT SIDE ================= */

    .left-side{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:25px;
    }

    .title{
      width:240px;
      height:38px;
      background:var(--white);
      border-radius:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      color:var(--text);
      font-size:19px;
      transition:0.3s;
    }

    /* ================= SENSOR CARDS ================= */

    .sensor-card{
      width:190px;
      height:200px;
      background:var(--panel);
      border-radius:18px;
      padding:10px;
      transition:0.3s;
    }

    .sensor-inner{
      width:100%;
      height:100%;
      background:var(--cyan);
      border-radius:15px;
      position:relative;
      transition:0.3s;
    }

    .sensor-label{
      width:145px;
      height:30px;
      background:var(--white);
      border-radius:8px;
      position:absolute;
      top:15px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      justify-content:center;
      align-items:center;
      color:var(--text);
      font-size:16px;
      transition:0.3s;
    }

    /* ================= RIGHT SIDE ================= */

    .right-side{
      width:600px;
      max-width:100%;
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    /* ================= DEVICE STATUS ================= */

    .device-status-wrapper{
      width:100%;
      background:var(--panel);
      border-radius:20px;
      padding:16px;
      transition:0.3s;
    }

    .device-status-inner{
      width:100%;
      background:var(--cyan);
      border-radius:18px;
      padding:24px 14px;
      display:flex;
      flex-direction:column;
      gap:18px;
      transition:0.3s;
    }

    .status-bar{
      width:100%;
      height:34px;
      background:var(--gray);
      border-radius:8px;
      transition:0.3s;
    }

    /* ================= CONTROL PANEL ================= */

    .control-wrapper{
      width:100%;
      background:var(--panel);
      border-radius:20px;
      padding:16px;
      transition:0.3s;
    }

    .control-inner{
      width:100%;
      background:var(--cyan);
      border-radius:18px;
      padding:25px;
      display:flex;
      justify-content:space-evenly;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
      transition:0.3s;
    }

    .control-box{
      width:150px;
      height:210px;
      background:var(--gray);
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
    }

    .control-box:hover{
      transform:scale(1.03);
    }

    /* ================= BOTTOM BAR ================= */

    .bottom-bar{
      width:100%;
      height:60px;
      background:var(--top-bottom);
      display:flex;
      align-items:center;
      gap:12px;
      padding-left:18px;
      transition:0.3s;
    }

    .bottom-icon{
      width:40px;
      height:40px;
      background:var(--white);
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .bottom-icon span{
      font-size:30px;
      color:var(--text);
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:950px){

      .main-content{
        flex-direction:column;
        align-items:center;
      }

      .right-side{
        width:100%;
      }

      .control-inner{
        justify-content:center;
      }

    }

    @media(max-width:600px){

      .top-bar{
        padding:0 15px;
      }

      .classroom-name{
        width:220px;
        font-size:15px;
      }

      .control-box{
        width:100%;
        max-width:250px;
      }

      .settings-panel{
        top:85px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- SETTINGS PANEL -->
    <div class="settings-panel" id="settingsPanel">

      <!-- DARK MODE -->
      <div class="setting-option" onclick="toggleDarkMode()">
        <span class="material-symbols-outlined">
          dark_mode
        </span>
      </div>

      <!-- SILENT NOTIF -->
      <div class="setting-option">
        <span class="material-symbols-outlined">
          notifications_off
        </span>
      </div>

      <!-- CHART -->
      <div class="setting-option" onclick="openChart()">
        <span class="material-symbols-outlined">
          bar_chart
        </span>
      </div>

      <!-- LOGOUT -->
      <div class="setting-option" onclick="logout()">
        <span class="material-symbols-outlined">
          logout
        </span>
      </div>

    </div>

    <!-- TOP BAR -->
    <div class="top-bar">

      <div class="classroom-name">
        Smart Classroom Name
      </div>

      <div class="settings-btn" onclick="toggleSettings()">
        <span class="material-symbols-outlined">
          settings
        </span>
      </div>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

      <!-- LEFT SIDE -->
      <div class="left-side">

        <div class="title">
          Sensor Readings
        </div>

        <div class="sensor-card">
          <div class="sensor-inner">
            <div class="sensor-label">
              Temperature
            </div>
          </div>
        </div>

        <div class="sensor-card">
          <div class="sensor-inner">
            <div class="sensor-label">
              Humidity
            </div>
          </div>
        </div>

        <div class="sensor-card">
          <div class="sensor-inner">
            <div class="sensor-label">
              Rain
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT SIDE -->
      <div class="right-side">

        <div class="title">
          Device Status
        </div>

        <div class="device-status-wrapper">

          <div class="device-status-inner">

            <div class="status-bar"></div>
            <div class="status-bar"></div>
            <div class="status-bar"></div>
            <div class="status-bar"></div>
            <div class="status-bar"></div>

          </div>

        </div>

        <div class="title">
          Control Panel
        </div>

        <div class="control-wrapper">

          <div class="control-inner">

            <div class="control-box"></div>
            <div class="control-box"></div>
            <div class="control-box"></div>

          </div>

        </div>

      </div>

    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">

      <div class="bottom-icon">
        <span class="material-symbols-outlined">
          notifications
        </span>
      </div>

      <div class="bottom-icon">
        <span class="material-symbols-outlined">
          person
        </span>
      </div>

    </div>

  </div>

  <script>

    const settingsPanel =
    document.getElementById("settingsPanel");

    /* ================= SETTINGS PANEL ================= */

    function toggleSettings(){
      settingsPanel.classList.toggle("active");
    }

    /* ================= DARK MODE ================= */

    function toggleDarkMode(){
      document.body.classList.toggle("dark-mode");
    }

    /* ================= CHART ================= */

    function openChart(){
      alert("Opening Chart...");
    }

    /* ================= LOGOUT ================= */

    function logout(){
      alert("Logging Out...");
    }

  </script>

</body>
</html>
