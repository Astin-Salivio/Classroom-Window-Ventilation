<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Classroom UI</title>

  <!-- Google Icons -->
  <link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <style>

    /* ================= ROOT COLORS ================= */

    :root{
      --main-bg:#b8d4b2;
      --top-bottom:#d8c1a1;
      --panel:#f5f5f5;
      --cyan:#c8e7ea;
      --gray:#cfcfcf;
      --text:#222;
      --white:#efefef;
    }

    body.dark-mode{
      --main-bg:#1f2a24;
      --top-bottom:#3c352d;
      --panel:#2c2c2c;
      --cyan:#35545a;
      --gray:#4c4c4c;
      --text:#ffffff;
      --white:#3a3a3a;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      transition:0.3s;
    }

    .container{
      width:960px;
      height:870px;
      background:var(--main-bg);
      position:relative;
      overflow:hidden;
      border:1px solid #d9d9d9;
      transition:0.3s;
    }

    /* ================= TOP BAR ================= */

    .top-bar{
      width:100%;
      height:70px;
      background:var(--top-bottom);
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 20px;
      transition:0.3s;
    }

    .classroom-name{
      width:275px;
      height:40px;
      background:var(--white);
      border-radius:10px;
      display:flex;
      align-items:center;
      padding-left:18px;
      font-size:18px;
      color:var(--text);
      transition:0.3s;
    }

    .settings-btn{
      width:42px;
      height:42px;
      background:var(--white);
      border-radius:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .settings-btn span{
      font-size:32px;
      color:var(--text);
    }

    /* ================= TITLES ================= */

    .title{
      background:var(--white);
      color:var(--text);
      border-radius:10px;
      height:35px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      position:absolute;
      transition:0.3s;
    }

    .sensor-title{
      width:225px;
      top:90px;
      left:70px;
    }

    .status-title{
      width:285px;
      top:90px;
      left:460px;
    }

    .control-title{
      width:285px;
      top:437px;
      left:458px;
    }

    /* ================= SENSOR CARDS ================= */

    .sensor-column{
      position:absolute;
      top:140px;
      left:90px;
      display:flex;
      flex-direction:column;
      gap:30px;
    }

    .sensor-card{
      width:180px;
      height:195px;
      background:var(--panel);
      border-radius:18px;
      padding:10px;
      transition:0.3s;
    }

    .sensor-inner{
      width:100%;
      height:100%;
      background:var(--cyan);
      border-radius:15px;
      position:relative;
      transition:0.3s;
    }

    .sensor-label{
      width:140px;
      height:28px;
      background:var(--white);
      border-radius:8px;
      position:absolute;
      top:15px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      justify-content:center;
      align-items:center;
      color:var(--text);
      transition:0.3s;
    }

    /* ================= DEVICE STATUS ================= */

    .device-status-wrapper{
      width:500px;
      height:280px;
      background:var(--panel);
      border-radius:20px;
      position:absolute;
      top:142px;
      left:342px;
      padding:16px;
      transition:0.3s;
    }

    .device-status-inner{
      width:100%;
      height:100%;
      background:var(--cyan);
      border-radius:18px;
      padding:24px 14px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition:0.3s;
    }

    .status-bar{
      width:100%;
      height:32px;
      background:var(--gray);
      border-radius:8px;
      transition:0.3s;
    }

    /* ================= CONTROL PANEL ================= */

    .control-wrapper{
      width:500px;
      height:275px;
      background:var(--panel);
      border-radius:20px;
      position:absolute;
      top:485px;
      left:342px;
      padding:16px;
      transition:0.3s;
    }

    .control-inner{
      width:100%;
      height:100%;
      background:var(--cyan);
      border-radius:18px;
      display:flex;
      justify-content:space-evenly;
      align-items:center;
      transition:0.3s;
    }

    .control-box{
      width:135px;
      height:198px;
      background:var(--gray);
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
    }

    .control-box:hover{
      transform:scale(1.03);
    }

    /* ================= BOTTOM BAR ================= */

    .bottom-bar{
      width:100%;
      height:55px;
      background:var(--top-bottom);
      position:absolute;
      bottom:0;
      left:0;
      display:flex;
      align-items:center;
      gap:12px;
      padding-left:18px;
      transition:0.3s;
    }

    .bottom-icon{
      width:38px;
      height:38px;
      background:var(--white);
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .bottom-icon span{
      font-size:30px;
      color:var(--text);
    }

    /* ================= SETTINGS SIDE PANEL ================= */

    .settings-panel{
      width:120px;
      height:475px;
      background:var(--gray);
      border-radius:22px;
      position:absolute;
      top:12px;
      right:-150px; /* HIDDEN */
      transition:0.4s ease;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:24px;
      gap:22px;
      z-index:999;
    }

    .settings-panel.active{
      right:20px;
    }

    .setting-option{
      width:72px;
      height:86px;
      background:var(--cyan);
      border-radius:18px;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition:0.3s;
    }

    .setting-option:hover{
      transform:scale(1.05);
    }

    .setting-option span{
      font-size:42px;
      color:var(--text);
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- SETTINGS PANEL -->
    <div class="settings-panel" id="settingsPanel">

      <!-- DARK MODE -->
      <div class="setting-option" onclick="toggleDarkMode()">
        <span class="material-symbols-outlined">
          dark_mode
        </span>
      </div>

      <!-- SILENT NOTIF -->
      <div class="setting-option">
        <span class="material-symbols-outlined">
          notifications_off
        </span>
      </div>

      <!-- CHART -->
      <div class="setting-option" onclick="openChart()">
        <span class="material-symbols-outlined">
          bar_chart
        </span>
      </div>

      <!-- LOGOUT -->
      <div class="setting-option" onclick="logout()">
        <span class="material-symbols-outlined">
          logout
        </span>
      </div>

    </div>

    <!-- TOP BAR -->
    <div class="top-bar">

      <div class="classroom-name">
        Smart Classroom Name
      </div>

      <div class="settings-btn" onclick="toggleSettings()">
        <span class="material-symbols-outlined">
          settings
        </span>
      </div>

    </div>

    <!-- TITLES -->
    <div class="title sensor-title">
      Sensor Readings
    </div>

    <div class="title status-title">
      Device Status
    </div>

    <div class="title control-title">
      Control Panel
    </div>

    <!-- SENSOR COLUMN -->
    <div class="sensor-column">

      <div class="sensor-card">
        <div class="sensor-inner">
          <div class="sensor-label">
            Temperature
          </div>
        </div>
      </div>

      <div class="sensor-card">
        <div class="sensor-inner">
          <div class="sensor-label">
            Humidity
          </div>
        </div>
      </div>

      <div class="sensor-card">
        <div class="sensor-inner">
          <div class="sensor-label">
            Rain
          </div>
        </div>
      </div>

    </div>

    <!-- DEVICE STATUS -->
    <div class="device-status-wrapper">

      <div class="device-status-inner">

        <div class="status-bar"></div>
        <div class="status-bar"></div>
        <div class="status-bar"></div>
        <div class="status-bar"></div>
        <div class="status-bar"></div>

      </div>

    </div>

    <!-- CONTROL PANEL -->
    <div class="control-wrapper">

      <div class="control-inner">

        <div class="control-box"></div>
        <div class="control-box"></div>
        <div class="control-box"></div>

      </div>

    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">

      <div class="bottom-icon">
        <span class="material-symbols-outlined">
          notifications
        </span>
      </div>

      <div class="bottom-icon">
        <span class="material-symbols-outlined">
          person
        </span>
      </div>

    </div>

  </div>

  <script>

    const settingsPanel = document.getElementById("settingsPanel");

    /* ================= TOGGLE SETTINGS PANEL ================= */

    function toggleSettings(){
      settingsPanel.classList.toggle("active");
    }

    /* ================= DARK MODE ================= */

    function toggleDarkMode(){
      document.body.classList.toggle("dark-mode");
    }

    /* ================= CHART ================= */

    function openChart(){
      alert("Opening Chart...");
    }

    /* ================= LOGOUT ================= */

    function logout(){
      alert("Logging Out...");
    }

  </script>

</body>
</html>
