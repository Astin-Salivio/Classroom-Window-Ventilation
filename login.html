<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Classroom Login</title>

  <style>

    /* ================= GLOBAL ================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      width:100%;
      height:100vh;
      background:#ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* ================= MAIN CONTAINER ================= */

    .container{
      width:420px;
      height:420px;
      background:#c4ddb8;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:40px;
    }

    /* ================= LOGO BOX ================= */

    .logo-box{
      width:235px;
      height:115px;
      background:#efefef;
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#444;
      font-size:11px;
      margin-bottom:25px;
    }

    /* ================= WELCOME BAR ================= */

    .welcome-bar{
      width:185px;
      height:18px;
      background:#efefef;
      border-radius:6px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:10px;
      color:#444;
      margin-bottom:12px;
    }

    /* ================= LOGIN PANEL ================= */

    .login-panel{
      width:215px;
      height:145px;
      background:#d9ffff;
      border:5px solid #ffffff;
      border-radius:8px;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:18px;
      gap:12px;
    }

    /* ================= INPUT BOX ================= */

    .input-box{
      width:165px;
      height:22px;
      background:#d3d0d0;
      border-radius:7px;
      display:flex;
      align-items:center;
      padding:0 10px;
      gap:8px;
    }

    .input-box img{
      width:12px;
      height:12px;
      object-fit:contain;
    }

    .input-box input{
      border:none;
      outline:none;
      background:transparent;
      width:100%;
      font-size:10px;
      color:#333;
    }

    .input-box input::placeholder{
      color:#444;
    }

    /* ================= LOGIN BUTTON ================= */

    .login-btn{
      width:62px;
      height:22px;
      border:none;
      border-radius:7px;
      background:#d3d0d0;
      font-size:10px;
      color:#333;
      cursor:pointer;
      transition:0.2s;
    }

    .login-btn:hover{
      transform:scale(1.04);
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <div class="logo-box">
      logo
    </div>

    <!-- WELCOME -->
    <div class="welcome-bar">
      Welcome, name
    </div>

    <!-- LOGIN PANEL -->
    <div class="login-panel">

      <!-- USERNAME -->
      <div class="input-box">

        <img src="icons/user.png" alt="user icon">

        <input type="text"
        placeholder="username">

      </div>

      <!-- PASSWORD -->
      <div class="input-box">

        <img src="icons/lock.png" alt="lock icon">

        <input type="password"
        placeholder="password">

      </div>

      <!-- BUTTON -->
      <button class="login-btn"
      onclick="login()">
        Log In
      </button>

    </div>

  </div>

  <script>

    function login(){

      const username =
      document.querySelectorAll("input")[0].value;

      const password =
      document.querySelectorAll("input")[1].value;

      if(username === "" || password === ""){

        alert("Please fill in all fields.");

      }else{

        alert("Logging In...");

      }

    }

  </script>

</body>
</html>
