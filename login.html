<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Classroom Login</title>

  <style>

    /* ================= GLOBAL ================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    /* ================= BODY ================= */

    body{
      width:100%;
      min-height:100vh;
      background:#c6ddb9;
      display:flex;
      flex-direction:column;
    }

    /* ================= HEADER ================= */

    .header{
      width:100%;
      height:90px;
      background:#b89f7a;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:32px;
      font-weight:bold;
      letter-spacing:1px;
    }

    /* ================= MAIN SECTION ================= */

    .main-section{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px 20px;
    }

    /* ================= MAIN CONTENT ================= */

    .main-wrapper{
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* ================= LOGO PANEL ================= */

    .logo-panel{
      width:420px;
      height:220px;
      background:#f1f1f1;
      border-radius:12px;
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:35px;
    }

    .logo-panel img{
      width:140px;
      height:140px;
      object-fit:contain;
    }

    /* ================= WELCOME BAR ================= */

    .welcome-bar{
      width:300px;
      height:35px;
      background:#f1f1f1;
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:18px;
      color:#444;
      margin-bottom:20px;
    }

    /* ================= LOGIN CARD ================= */

    .login-card{
      width:420px;
      background:#d7f7f8;
      border:7px solid #ffffff;
      border-radius:12px;
      padding:35px 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
    }

    /* ================= INPUT BOX ================= */

    .input-box{
      width:320px;
      height:45px;
      background:#d0d0d0;
      border-radius:10px;
      display:flex;
      align-items:center;
      padding:0 15px;
      gap:12px;
    }

    .input-box img{
      width:22px;
      height:22px;
      object-fit:contain;
    }

    .input-box input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-size:16px;
      color:#333;
    }

    .input-box input::placeholder{
      color:#555;
    }

    /* ================= LOGIN BUTTON ================= */

    .login-btn{
      width:140px;
      height:45px;
      border:none;
      border-radius:10px;
      background:#d0d0d0;
      font-size:16px;
      color:#333;
      cursor:pointer;
      transition:0.2s;
    }

    .login-btn:hover{
      transform:scale(1.05);
    }

    /* ================= FOOTER ================= */

    .footer{
      width:100%;
      height:70px;
      background:#b89f7a;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:18px;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:600px){

      .logo-panel{
        width:90%;
        height:180px;
      }

      .login-card{
        width:90%;
      }

      .input-box{
        width:85%;
      }

      .welcome-bar{
        width:70%;
      }

    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    Smart Classroom System
  </div>

  <!-- MAIN -->
  <div class="main-section">

    <div class="main-wrapper">

      <!-- LOGO -->
      <div class="logo-panel">

        <!-- LOCAL IMAGE -->
        <img src="assets/logo.svg" alt="logo">

      </div>

      <!-- WELCOME -->
      <div class="welcome-bar">
        Welcome, name
      </div>

      <!-- LOGIN CARD -->
      <div class="login-card">

        <!-- USERNAME -->
        <div class="input-box">

          <img src="assets/user.svg" alt="user">

          <input type="text"
          id="username"
          placeholder="username">

        </div>

        <!-- PASSWORD -->
        <div class="input-box">

          <img src="assets/key.svg" alt="lock">

          <input type="password"
          id="password"
          placeholder="password">

        </div>

        <!-- LOGIN BUTTON -->
        <button class="login-btn"
        onclick="login()">
          Log In
        </button>

      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    Smart Classroom Window and Ventilation Controller
  </div>

  <script>

    function login(){

      const username =
      document.getElementById("username").value;

      const password =
      document.getElementById("password").value;

      /* SIMPLE LOGIN CHECK */

      if(username === "" || password === ""){

        alert("Please fill in all fields.");

      }

      else{

        alert("Login Successful!");

        

        window.location.href = "main.html";

      }

    }

  </script>

</body>
</html>
