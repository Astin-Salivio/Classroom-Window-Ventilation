<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Classroom Login</title>

  <style>

    /* ================= GLOBAL ================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    /* ================= BODY ================= */

    body{
      width:100%;
      min-height:100vh;
      background:#c6ddb9;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
    }

    /* ================= MAIN CONTENT ================= */

    .main-wrapper{
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* ================= LOGO PANEL ================= */

    .logo-panel{
      width:240px;
      height:120px;
      background:#f1f1f1;
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:25px;
    }

    .logo-panel img{
      width:90px;
      height:90px;
      object-fit:contain;
    }

    /* ================= WELCOME BAR ================= */

    .welcome-bar{
      width:185px;
      height:18px;
      background:#f1f1f1;
      border-radius:6px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:10px;
      color:#444;
      margin-bottom:12px;
    }

    /* ================= LOGIN CARD ================= */

    .login-card{
      width:220px;
      background:#d7f7f8;
      border:5px solid #ffffff;
      border-radius:8px;
      padding:18px 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    /* ================= INPUT BOX ================= */

    .input-box{
      width:170px;
      height:22px;
      background:#d0d0d0;
      border-radius:7px;
      display:flex;
      align-items:center;
      padding:0 10px;
      gap:8px;
    }

    .input-box img{
      width:12px;
      height:12px;
      object-fit:contain;
    }

    .input-box input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-size:10px;
      color:#333;
    }

    .input-box input::placeholder{
      color:#555;
    }

    /* ================= LOGIN BUTTON ================= */

    .login-btn{
      width:62px;
      height:22px;
      border:none;
      border-radius:7px;
      background:#d0d0d0;
      font-size:10px;
      color:#333;
      cursor:pointer;
      transition:0.2s;
    }

    .login-btn:hover{
      transform:scale(1.05);
    }

  </style>
</head>

<body>

  <div class="main-wrapper">

    <!-- LOGO -->
    <div class="logo-panel">

      <!-- LOCAL IMAGE -->
      <img src="images/logo.png" alt="logo">

    </div>

    <!-- WELCOME -->
    <div class="welcome-bar">
      Welcome, name
    </div>

    <!-- LOGIN CARD -->
    <div class="login-card">

      <!-- USERNAME -->
      <div class="input-box">

        <img src="icons/user.png" alt="user">

        <input type="text"
        id="username"
        placeholder="username">

      </div>

      <!-- PASSWORD -->
      <div class="input-box">

        <img src="icons/lock.png" alt="lock">

        <input type="password"
        id="password"
        placeholder="password">

      </div>

      <!-- LOGIN BUTTON -->
      <button class="login-btn"
      onclick="login()">
        Log In
      </button>

    </div>

  </div>

  <script>

    function login(){

      const username =
      document.getElementById("username").value;

      const password =
      document.getElementById("password").value;

      /* SIMPLE LOGIN CHECK */

      if(username === "" || password === ""){

        alert("Please fill in all fields.");

      }

      else{

        alert("Login Successful!");

        /* REDIRECT TO test.html */

        window.location.href = "test.html";

      }

    }

  </script>

</body>
</html>
