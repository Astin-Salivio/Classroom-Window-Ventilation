<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Classroom Login</title>

  <style>

    /* ================= GLOBAL ================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      width:100%;
      height:100vh;
      background:#ffffff;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* ================= MAIN CONTAINER ================= */

    .container{
      width:420px;
      height:420px;
      background:#c6ddb9;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:40px;
    }

    /* ================= LOGO PANEL ================= */

    .logo-panel{
      width:235px;
      height:115px;
      background:#f3f3f3;
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:28px;
    }

    .logo-panel img{
      width:85px;
      height:85px;
      object-fit:contain;
    }

    /* ================= WELCOME ================= */

    .welcome-bar{
      width:185px;
      height:18px;
      background:#f3f3f3;
      border-radius:6px;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:10px;
      color:#444;
      margin-bottom:12px;
    }

    /* ================= LOGIN CARD ================= */

    .login-card{
      width:215px;
      background:#d8f6f8;
      border:5px solid #ffffff;
      border-radius:8px;
      padding:18px 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    /* ================= INPUT CONTAINER ================= */

    .input-container{
      width:165px;
      height:22px;
      background:#d0d0d0;
      border-radius:7px;
      display:flex;
      align-items:center;
      padding:0 10px;
      gap:8px;
    }

    /* ICON */

    .input-container img{
      width:12px;
      height:12px;
      object-fit:contain;
    }

    /* INPUT */

    .input-container input{
      width:100%;
      height:100%;
      border:none;
      outline:none;
      background:#d0d0d0;
      font-size:10px;
      color:#333;
    }

    .input-container input::placeholder{
      color:#555;
    }

    /* ================= BUTTON ================= */

    .login-btn{
      width:62px;
      height:22px;
      border:none;
      border-radius:7px;
      background:#d0d0d0;
      font-size:10px;
      color:#333;
      cursor:pointer;
      transition:0.2s;
    }

    .login-btn:hover{
      transform:scale(1.05);
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO SECTION -->
    <div class="logo-panel">

      <!-- LOCAL IMAGE -->
      <img src="images/logo.png" alt="logo">

    </div>

    <!-- WELCOME -->
    <div class="welcome-bar">
      Welcome, name
    </div>

    <!-- LOGIN CARD -->
    <div class="login-card">

      <!-- USERNAME -->
      <div class="input-container">

        <img src="icons/user.png" alt="user icon">

        <input type="text"
        placeholder="username">

      </div>

      <!-- PASSWORD -->
      <div class="input-container">

        <img src="icons/lock.png" alt="lock icon">

        <input type="password"
        placeholder="password">

      </div>

      <!-- LOGIN -->
      <button class="login-btn"
      onclick="login()">
        Log In
      </button>

    </div>

  </div>

  <script>

    function login(){

      const username =
      document.querySelectorAll("input")[0].value;

      const password =
      document.querySelectorAll("input")[1].value;

      if(username === "admin" || password === "1111"){

        alert("Please fill in all fields.");

      }

      else{

        alert("Logging In...");

      }

    }

  </script>

</body>
</html>
